# =============================================================================
# Japa Message CMS — REFERENCE nginx configuration
# =============================================================================
#
# ⚠️  THIS IS A REFERENCE TEMPLATE. IT IS NOT INSTALLED, RUN, OR ACTIVE.
#     It has never been loaded by an nginx process. Every value marked
#     <<REPLACE>> must be substituted by the operator before use.
#
# Purpose:
#   1. Terminate HTTPS.
#   2. Serve the built React SPA from apps/web/dist (with history fallback).
#   3. Proxy /api/* to the single Express process on 127.0.0.1:3000.
#   4. Forward webhook POSTs WITHOUT touching the raw request body, so that
#      HMAC verification in the CMS keeps working.
#
# Placeholders to replace:
#   cms.example.com              -> your production hostname
#   /var/www/japa/apps/web/dist   -> <app>/apps/web/dist on THIS host
#   /etc/nginx/ssl/...            -> your certificate paths
#
# Validate before use (read-only, does not start nginx):
#     nginx -t -c /path/to/nginx.conf
# Reload without dropping connections:
#     nginx -s reload
# -----------------------------------------------------------------------------

# Body limits.
#   • CMS JSON body limit is 1 MB   (express.json  limit: '1mb')
#   • CMS raw webhook limit is 1 MB (express.raw  limit: '1mb')
#   • Media upload limit is 5 MB    (multer MAX_FILE_SIZE = 5 * 1024 * 1024)
# 10m leaves headroom above the largest accepted upload without being open-ended.
client_max_body_size 10m;

proxy_request_buffering on;

server {
    listen 80;
    listen [::]:80;
    server_name cms.example.com;

    # ACME challenges are exempt so a certificate can be renewed without a
    # working redirect loop.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cms.example.com;

    # --- TLS (operator-supplied certificate) -------------------------------
    # Do not commit real certificate material to this repository.
    ssl_certificate     <<REPLACE>>/fullchain.pem;
    ssl_certificate_key <<REPLACE>>/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:CMS:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
# ---------------------------------------------------------------------
    # API — proxied to the ONE Express process.
    # ---------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Preserve the original Host so Express sees the public hostname.
        proxy_set_header Host              $host;

        # REQUIRED. app.set('trust proxy', 1) makes Express derive req.protocol
        # and req.secure from this header. Without it, NODE_ENV=production sets
        # cookie.secure=true and express-session silently refuses to emit
        # Set-Cookie — every login succeeds and is immediately lost.
        proxy_set_header X-Forwarded-Proto   $scheme;

        # Required for correct client IPs (login lockout is IP-scoped).
        proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;

        proxy_set_header X-Real-IP           $remote_addr;
        proxy_set_header X-Forwarded-Host    $host;
        proxy_set_header Upgrade             $http_upgrade;
        proxy_set_header Connection          "upgrade";

        # Timeouts comfortably above the CMS's own 20 s Apps Script budget.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Never let a proxy error page replace a structured CMS JSON error.
        proxy_intercept_errors off;
    }

    # ---------------------------------------------------------------------
    # WEBHOOKS — body integrity is critical.
    # ---------------------------------------------------------------------
    # Express verifies the OpenWA delivery webhook by HMAC-SHA256 over the
    # EXACT raw request bytes (index.ts mounts express.raw for /api/webhooks
    # BEFORE express.json). The proxy MUST therefore:
    #   • not buffer and re-serialise the body
    #   • not modify, trim, or decompress-then-forward the content differently
    #   • pass X-OpenWA-Signature through untouched
    # Default nginx proxying is byte-for-byte; the critical part is that you do
    # NOT add gzip/decompression, body rewriting, or caching here.
    location /api/webhooks/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_request_buffering on;
        proxy_buffering        on;
        proxy_cache            off;

        # Keep gzip OUT of this location so the forwarded body stays byte-exact.
        gzip off;

# ---------------------------------------------------------------------
    # React SPA — static assets from apps/web/dist, history fallback to index.html
    # ---------------------------------------------------------------------
    root <<REPLACE>>/apps/web/dist;   # e.g. /var/www/japa/apps/web/dist

    # Hashed build assets are immutable and can be cached aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        # index.html must never be cached, or browsers keep loading stale asset
        # references after a deploy.
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # History fallback. Every SPA route below is client-side only and returns
    # 404 if served as a file. Without this, a refresh on /recipients or
    # /messages/123/edit returns 404:
    #     /login /dashboard /messages /messages/new /messages/:id/edit
    #     /campaigns /campaigns/new /campaigns/:id/edit
    #     /recipients /recipients/import /history /settings /users
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/cms.access.log;
    error_log  /var/log/nginx/cms.error.log;
}

# =============================================================================
# WINDOWS DEPLOYMENT (nginx for Windows)
# =============================================================================
# The server block is identical; only filesystem paths change. Use forward
# slashes (nginx on Windows accepts them) and note that the SPA root and the
# Express process must be on the SAME drive letter, otherwise every absolute
# Media.storagePath row breaks (see docs/deployment/README.md section C.3).
#
#   root C:/japa/apps/web/dist;
#   ssl_certificate     C:/nginx/ssl/cms/fullchain.pem;
#   ssl_certificate_key C:/nginx/ssl/cms/privkey.pem;
#   access_log C:/nginx/logs/cms.access.log;
#
# Start manually (NOT part of this package):
#     cd C:\nginx
#     .\nginx.exe
# -----------------------------------------------------------------------------
        proxy_read_timeout 30s;
    }